name: Release
on:
  push:
    tags:
      - "*"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # tags with a suffix (v0.6.10-preview, v0.7.0-beta) are published as pre-releases, never as "Latest"
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/redist/houdini.zip
            artifacts/redist/comfy.zip
            artifacts/redist/houdini-comfyui-connection-beta-${{github.ref_name}}.zip
